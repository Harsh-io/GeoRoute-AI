<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">GeoRoute AI geospatial routing workflow</title>
  <desc id="desc">A dark workflow diagram showing input data, preprocessing, cost-surface generation, route optimization, route refinement, and final candidate routes.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#172338"/>
    </linearGradient>
    <linearGradient id="input" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#183952"/>
      <stop offset="1" stop-color="#14556a"/>
    </linearGradient>
    <linearGradient id="process" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#242b4b"/>
      <stop offset="1" stop-color="#33406d"/>
    </linearGradient>
    <linearGradient id="cost" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b2e52"/>
      <stop offset="1" stop-color="#5a3569"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4b2e42"/>
      <stop offset="1" stop-color="#7a3d55"/>
    </linearGradient>
    <linearGradient id="output" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#174b4a"/>
      <stop offset="1" stop-color="#1c6b61"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity=".35"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#7dd3fc"/>
    </marker>
    <style>
      .title { font: 700 42px Arial, sans-serif; fill: #f8fafc; letter-spacing: .4px; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #a8b7cc; }
      .stage { font: 700 24px Arial, sans-serif; fill: #f8fafc; }
      .body { font: 400 17px Arial, sans-serif; fill: #d7e2f0; }
      .small { font: 400 14px Arial, sans-serif; fill: #a9bad0; }
      .metric { font: 700 18px Arial, sans-serif; fill: #f8fafc; }
      .status { font: 700 13px Arial, sans-serif; letter-spacing: 1.4px; }
      .card { stroke: #ffffff; stroke-opacity: .12; stroke-width: 1.5; }
      .line { stroke: #7dd3fc; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .icon { stroke: #d7f3ff; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1600" height="1040" rx="28" fill="url(#background)"/>
  <circle cx="1450" cy="80" r="230" fill="#2563eb" opacity=".08"/>
  <circle cx="100" cy="960" r="260" fill="#14b8a6" opacity=".06"/>

  <text x="80" y="82" class="title">GeoRoute AI · Routing workflow</text>
  <text x="80" y="118" class="subtitle">From multi-modal geospatial inputs to validated, preliminary candidate corridors</text>
  <rect x="80" y="146" width="1440" height="1" fill="#94a3b8" opacity=".22"/>

  <!-- Row one -->
  <g filter="url(#shadow)">
    <rect x="80" y="205" width="400" height="290" rx="22" fill="url(#input)" class="card"/>
    <rect x="520" y="205" width="400" height="290" rx="22" fill="url(#process)" class="card"/>
    <rect x="1040" y="205" width="480" height="290" rx="22" fill="url(#cost)" class="card"/>
  </g>

  <!-- Input icon -->
  <g transform="translate(112 244)" class="icon">
    <path d="M3 31h42M8 31V10h32v21M16 10V3h16v7M14 18h20M14 25h20"/>
  </g>
  <text x="175" y="272" class="stage">1 · Input data</text>
  <text x="112" y="323" class="body">• Sentinel-2 optical imagery</text>
  <text x="112" y="352" class="body">• Copernicus DEM elevation</text>
  <text x="112" y="381" class="body">• OSM / Overpass vectors</text>
  <text x="112" y="410" class="body">• Region, dates and raster config</text>
  <text x="112" y="452" class="status" fill="#7dd3fc">IMPLEMENTED · INGESTION MODULES</text>

  <!-- Preprocessing icon -->
  <g transform="translate(552 240)" class="icon">
    <rect x="4" y="4" width="38" height="38" rx="4"/>
    <path d="M4 17h38M4 30h38M17 4v38M30 4v38"/>
    <path d="M53 12l10 10-10 10M50 22h13"/>
  </g>
  <text x="615" y="272" class="stage">2 · Preprocessing</text>
  <text x="552" y="323" class="body">• Repair and normalize geometries</text>
  <text x="552" y="352" class="body">• Reproject to metric UTM CRS</text>
  <text x="552" y="381" class="body">• Co-register the target grid</text>
  <text x="552" y="410" class="body">• Build validity and hard masks</text>
  <text x="552" y="452" class="status" fill="#7dd3fc">IMPLEMENTED · EPSG:32643 EXAMPLE</text>

  <!-- Cost icon -->
  <g transform="translate(1072 239)" class="icon">
    <path d="M4 41V5h44v36"/>
    <path d="M4 41h44M12 33l8-9 7 5 12-15"/>
    <circle cx="20" cy="24" r="2"/><circle cx="27" cy="29" r="2"/><circle cx="39" cy="14" r="2"/>
  </g>
  <text x="1135" y="272" class="stage">3 · Cost surfaces</text>
  <text x="1072" y="323" class="body">Three aligned friction/cost rasters:</text>
  <text x="1072" y="355" class="body">• Physical distance</text>
  <text x="1072" y="383" class="body">• Construction difficulty</text>
  <text x="1072" y="411" class="body">• Environmental sensitivity</text>
  <text x="1072" y="452" class="status" fill="#f0abfc">IMPLEMENTED · DIAGNOSTICS AVAILABLE</text>

  <!-- Row one arrows -->
  <path d="M480 350 H510" class="line"/>
  <path d="M920 350 H1030" class="line"/>

  <!-- Downstream connector -->
  <path d="M1280 495 V575 H320 V625" class="line"/>

  <!-- Row two -->
  <g filter="url(#shadow)">
    <rect x="80" y="625" width="480" height="290" rx="22" fill="url(#route)" class="card"/>
    <rect x="650" y="625" width="400" height="290" rx="22" fill="url(#process)" class="card"/>
    <rect x="1140" y="625" width="380" height="290" rx="22" fill="url(#output)" class="card"/>
  </g>

  <!-- Optimization icon -->
  <g transform="translate(112 665)" class="icon">
    <circle cx="26" cy="25" r="20"/>
    <path d="M26 13v13l9 7M4 25h-1M49 25h-1M26 3v-1M26 48v-1"/>
    <path d="M60 8l9 9-9 9M58 17h11"/>
  </g>
  <text x="190" y="692" class="stage">4 · Route optimization</text>
  <text x="112" y="744" class="body">Independent objective searches on an</text>
  <text x="112" y="772" class="body">8-connected raster grid:</text>
  <text x="112" y="804" class="body">• PYORPS / Cython Dijkstra (default)</text>
  <text x="112" y="832" class="body">• Distance × average cell friction</text>
  <text x="112" y="872" class="status" fill="#f8b4c7">IMPLEMENTED · 3 OBJECTIVES</text>

  <!-- Refinement icon -->
  <g transform="translate(682 665)" class="icon">
    <rect x="4" y="4" width="39" height="39" rx="4"/>
    <path d="M10 35l9-14 8 6 10-16M55 8h13M61 8v34M55 42h13"/>
  </g>
  <text x="754" y="692" class="stage">5 · Route refinement</text>
  <text x="682" y="744" class="body">Regional coarse-to-fine routing:</text>
  <text x="682" y="776" class="body">• Coarse overview path</text>
  <text x="682" y="808" class="body">• Buffered fine-resolution corridor</text>
  <text x="682" y="840" class="body">• A* fallback if PYORPS fails</text>
  <text x="682" y="882" class="status" fill="#f0abfc">IMPLEMENTED · BOUNDED APPROXIMATION</text>

  <!-- Output icon -->
  <g transform="translate(1172 664)" class="icon">
    <path d="M5 43V8h46v35M5 43h46M13 35l8-12 7 6 13-17"/>
    <path d="M62 15l7 7-7 7M60 22h9"/>
  </g>
  <text x="1240" y="692" class="stage">6 · Candidate routes</text>
  <text x="1172" y="744" class="body">Exported GeoJSON + manifests</text>
  <text x="1172" y="776" class="body">3 objectives · validation reports</text>
  <text x="1172" y="818" class="metric">2.72 km · 3.73 km · 3.16 km</text>
  <text x="1172" y="850" class="small">Mandi study-area example · 10 m grid</text>
  <text x="1172" y="882" class="status" fill="#8ff0d1">IMPLEMENTED · PRELIMINARY CORRIDORS</text>

  <!-- Row two arrows -->
  <path d="M560 770 H640" class="line"/>
  <path d="M1050 770 H1130" class="line"/>

  <!-- Evidence footer -->
  <rect x="80" y="960" width="1440" height="1" fill="#94a3b8" opacity=".22"/>
  <text x="80" y="995" class="small">Evidence: data/routes/route_results.json · data/routes/routing_manifest.json · data/cost/diagnostics/cost_surfaces_comparison.png</text>
  <text x="1520" y="995" text-anchor="end" class="small">Not a certified engineering alignment</text>
</svg>
