[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "georoute-ai"
version = "1.0.0"
description = "Enterprise geospatial data ingestion and preprocessing pipeline for infrastructure routing."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
	"osmnx>=1.9.0",
	"geopandas>=0.14.0",
	"shapely>=2.0.0",
	"pyproj>=3.6.0",
	"pyogrio>=0.7.0",
	"rasterio>=1.3.8",
	"affine>=2.4.0,<3.0.0",
	"numpy>=1.24.0",
	"pystac-client>=0.7.2",
	"planetary-computer>=1.0.0",
	"requests>=2.31.0",
	"tenacity>=8.2.3",
	"pyyaml>=6.0.1",
	"python-dotenv>=1.0.0",
	"pydantic>=2.5.0",
	"rich>=13.7.0",
	"tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
	"pytest>=7.4.0",
]

[project.scripts]
georoute = "main:main"

[tool.setuptools.packages.find]
include = ["georoute*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
